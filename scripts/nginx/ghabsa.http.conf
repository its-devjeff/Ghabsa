# =============================================================================
# ghabsa.com - Nginx site, HTTP-only phase (before the certificate exists).
# Installed to /etc/nginx/sites-available/ghabsa.conf by sync_nginx (scripts/lib/common.sh) with
# REPLACE_DOMAIN substituted from DOMAIN in scripts/.deploy.env. setup-tls.sh swaps in
# ghabsa.tls.conf; from then on every deploy keeps the TLS variant.
#
# This site NEVER claims default_server: it answers only for its own names, so it cannot capture
# traffic meant for any other server block on the same Nginx.
# =============================================================================

# Node over the private Unix socket (ghabsa-api.service). keepalive_timeout stays BELOW Node's own
# 5s keep-alive, otherwise Nginx reuses connections Node has just closed -> sporadic 502s.
upstream ghabsa_api {
    server unix:/run/ghabsa/api.sock;
    keepalive 8;
    keepalive_timeout 4s;
}

# WebP negotiation: browsers that accept WebP get the <file>.webp sibling the deploy writes next to
# large JPEG/PNGs (scripts/local/optimize-images.py); others get the original. Used by the image
# locations in snippets/ghabsa-site.conf. (http-level, like the upstream - hence the unique name.)
map $http_accept $ghabsa_webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_DOMAIN www.REPLACE_DOMAIN;

    include snippets/ghabsa-site.conf;
}
