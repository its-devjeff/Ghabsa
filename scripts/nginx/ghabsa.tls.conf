# =============================================================================
# ghabsa.com - Nginx site, TLS (production). Installed by sync_nginx once setup-tls.sh has issued
# the certificate and set /etc/nginx/.ghabsa-tls-active; REPLACE_DOMAIN is substituted.
#
#   http://{,www.}REPLACE_DOMAIN   -> ACME passthrough + 301 to https://REPLACE_DOMAIN
#   https://www.REPLACE_DOMAIN     -> 301 to https://REPLACE_DOMAIN (one canonical origin, so the
#                                     httpOnly auth cookie and the SPA always share one host)
#   https://REPLACE_DOMAIN         -> the site (snippets/ghabsa-site.conf)
#
# One certificate lineage (/etc/letsencrypt/live/REPLACE_DOMAIN/) covering both names.
# Never default_server - see ghabsa.http.conf.
# =============================================================================

upstream ghabsa_api {
    server unix:/run/ghabsa/api.sock;
    keepalive 8;
    keepalive_timeout 4s;          # below Node's 5s keep-alive - see ghabsa.http.conf
}

# WebP negotiation: browsers that accept WebP get the <file>.webp sibling the deploy writes next to
# large JPEG/PNGs (scripts/local/optimize-images.py); others get the original. Used by the image
# locations in snippets/ghabsa-site.conf. (http-level, like the upstream - hence the unique name.)
map $http_accept $ghabsa_webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_DOMAIN www.REPLACE_DOMAIN;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://REPLACE_DOMAIN$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.REPLACE_DOMAIN;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/REPLACE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://REPLACE_DOMAIN$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name REPLACE_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/REPLACE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include snippets/ghabsa-site.conf;
}
