# =============================================================================
# ghabsa.com - the shared body of the site's server block. Installed to
# /etc/nginx/snippets/ghabsa-site.conf and included by BOTH ghabsa.http.conf and ghabsa.tls.conf,
# so the URL layout is identical before and after TLS. Source of truth is the repo (scripts/nginx/);
# the deploy overwrites the server copy.
#
#   /                               -> React SPA (client-side routing fallback to index.html)
#   /static/                        -> CRA's content-hashed JS/CSS/media - cached for a year
#   /api/, /healthz, /readyz        -> Node/Express over the private Unix socket
#   /uploads/ /Dinner/ /trendyPhoto/ /adverts/ /profile/
#                                   -> the upload store, served straight from disk; Node never
#                                      sees these requests (it only writes the files)
# =============================================================================

server_tokens off;
client_max_body_size 50M;          # library resources + images; the API sets no multer limit
client_body_timeout 60s;
client_header_timeout 10s;

access_log /var/log/nginx/ghabsa.access.log;
error_log  /var/log/nginx/ghabsa.error.log warn;

# The deploy writes a .gz beside every compressible build file, so the SPA's JS/CSS go out
# pre-compressed at zero CPU cost on this 1-vCPU box; `gzip on` still covers the API's JSON.
gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;

include snippets/ghabsa-headers.conf;

# Proxy headers at server scope so the exact-match probes inherit them too.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

location /.well-known/acme-challenge/ { root /var/www/certbot; }

# ---- API ----
location ^~ /api/ { proxy_pass http://ghabsa_api; }
location = /healthz { proxy_pass http://ghabsa_api; access_log off; }
location = /readyz  { proxy_pass http://ghabsa_api; access_log off; }

# ---- Upload store (regex, so it is listed BEFORE the generic image rule below - first regex wins) ----
location ~ ^/(uploads|Dinner|trendyPhoto|adverts|profile)/ {
    root /opt/ghabsa/production/data/ghabsa-api;
    add_header Cache-Control "public, max-age=604800";
    include snippets/ghabsa-headers.conf;
    access_log off;
}

# ---- The SPA ----
root /opt/ghabsa/production/ui/ghabsa-client;
index index.html;

# Content-hashed bundles: a changed file gets a new name, so cache forever. ^~ keeps the image
# regex below from grabbing /static/media/*.png and downgrading it to the 7-day policy.
location ^~ /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include snippets/ghabsa-headers.conf;
    access_log off;
}

# Un-hashed files from public/ (the ~47MB of photos under /Images, favicon, ...): cache a week,
# then revalidate by ETag. A missing image is a real 404, never the SPA shell.
location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|mp4)$ {
    add_header Cache-Control "public, max-age=604800";
    include snippets/ghabsa-headers.conf;
    access_log off;
}

# The shell must always be revalidated, or a deploy's new bundle names never reach returning users.
location = /index.html {
    add_header Cache-Control "no-cache";
    include snippets/ghabsa-headers.conf;
}

location / { try_files $uri /index.html; }   # client-side routes (BrowserRouter)
