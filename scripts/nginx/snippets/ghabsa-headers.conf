# ghabsa.com - security headers. Installed to /etc/nginx/snippets/ghabsa-headers.conf.
#
# Included at server scope AND inside every location that sets its own add_header: nginx's
# add_header REPLACES inherited headers rather than merging, so a location adding Cache-Control
# would otherwise silently ship without these.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browsers ignore HSTS received over plain HTTP (RFC 6797 s8.1), so this is inert until TLS is on.
add_header Strict-Transport-Security "max-age=31536000" always;
